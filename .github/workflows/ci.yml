name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MIN_LINE_COVERAGE: "85"

jobs:
  test:
    name: Tests + coverage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests with coverage
        # main.rs and cli.rs are argument plumbing exercised on a real PC, not in unit tests.
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --ignore-filename-regex 'bosebridge/src/(main|cli)\.rs' --fail-under-lines "$MIN_LINE_COVERAGE"
      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: cargo llvm-cov report --summary-only --ignore-filename-regex 'bosebridge/src/(main|cli)\.rs'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: ignore

  windows:
    name: Build + tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: bosebridge-windows
          path: target/release/bosebridge.exe
